<script>window.LESSON = {"so": 16, "ngay": "2027-03-11", "title": "Tàn cuộc Vua và Tốt", "lead": "Cờ tàn Vua và Tốt từ nền tảng đến thực chiến: hình vuông, đối đầu, ô then chốt và Tốt cột biên, sau đó là puzzle Lichess rating 1836 đến 1993.", "prev": {"file": "buoi-15.html", "title": "Buổi 15"}, "next": null, "keyPoints": ["Vua phòng thủ vào được hình vuông của Tốt thì đuổi kịp.", "Đối đầu: bên không phải đi là bên giữ đối đầu.", "Bên có Tốt nên đưa Vua đi trước để chiếm ô then chốt.", "Tốt cột biên dễ hòa khi Vua phòng thủ giữ được góc."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Bốn ý nền tảng", "blocks": [{"t": "p", "html": "Tàn cuộc chỉ còn Vua và Tốt: sai một nhịp là đổi kết quả. Nắm chắc bốn ý dưới đây trước khi làm bài."}, {"t": "h3", "text": "Quy tắc hình vuông"}, {"t": "p", "html": "Vẽ một hình vuông có cạnh là đoạn đường từ Tốt tới ô phong cấp. Khi không có quân nào khác giúp hay cản, Vua phòng thủ bước được vào hình vuông thì đuổi kịp Tốt. Nếu Tốt còn ở hàng xuất phát, hãy tính từ hàng 3 (hoặc hàng 6 với Đen) vì Tốt được đi hai ô."}, {"t": "diagram", "fen": "8/8/8/8/P7/5k2/8/7K b - - 0 1", "marks": ["a4", "b4", "c4", "d4", "e4", "a5", "e5", "a6", "e6", "a7", "e7", "a8", "b8", "c8", "d8", "e8"], "caption": "Viền hình vuông của Tốt a4. Đen đi và có thể bước vào."}, {"t": "h3", "text": "Đối đầu (opposition)"}, {"t": "p", "html": "Hai Vua đứng cùng một đường thẳng, cách nhau đúng một ô. Bên <strong>không<\/strong> phải đi là bên giữ đối đầu: Vua bên kia buộc phải nhường đường."}, {"t": "diagram", "fen": "8/3k4/8/3K4/4P3/8/8/8 b - - 0 1", "marks": ["d5", "d7"], "caption": "Trắng đang giữ đối đầu vì Đen phải đi."}, {"t": "h3", "text": "Ô then chốt (key squares)"}, {"t": "p", "html": "Là những ô mà Vua bên có Tốt chiếm được thì thắng, nếu Tốt không bị bắt. Với Tốt từ hàng 2 đến hàng 4 (không phải cột a, h), đó là ba ô ở phía trước Tốt hai hàng. Tốt e4 có ô then chốt d6, e6, f6. Khi Tốt đã sang nửa bàn bên kia, các ô ở ngay hàng trước Tốt cũng là ô then chốt."}, {"t": "diagram", "fen": "4k3/8/8/8/4P3/3K4/8/8 w - - 0 1", "marks": ["d6", "e6", "f6"], "caption": "Ba ô then chốt của Tốt e4."}, {"t": "h3", "text": "Tốt cột biên"}, {"t": "p", "html": "Tốt cột a hoặc h là ngoại lệ. Nếu Vua phòng thủ tới được góc phong cấp hoặc các ô sát đó và không bị đuổi ra, ván thường hòa vì dễ xảy ra bí cờ."}, {"t": "diagram", "fen": "6k1/8/8/6K1/7P/8/8/8 w - - 0 1", "marks": ["g8", "h8", "g7", "h7"], "caption": "Vua đen đã ở khu vực góc."}, {"t": "tip", "html": "<strong>Thứ tự suy nghĩ:<\/strong> Tốt có chạy thẳng được không (hình vuông)? Nếu không, Vua mình có chiếm được ô then chốt không? Ai đang giữ đối đầu? Cuối cùng mới đẩy Tốt."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "replay", "title": "Puzzle mẫu #rs8DR", "fen": "8/8/2pk1pp1/pp6/1P1P1PP1/P2K4/8/8 b - - 1 43", "moves": ["axb4", "axb4", "Kd5", "Ke3", "Kc4"], "intro": "Trắng vừa đi Kd3. Đen đi. Puzzle Lichess #rs8DR, rating 1868.", "notes": {"1": "Đen: Tốt ăn Tốt ở b4.", "2": "Trắng: Tốt ăn Tốt ở b4.", "3": "Đen: Vua đi tới d5.", "4": "Trắng: Vua đi tới e3.", "5": "Đen: Vua đi tới c4."}}]}, {"id": "the-co", "nav": "Bài tập", "tag": "Bài tập", "h": "Từ thế nền tảng đến puzzle", "blocks": [{"t": "p", "html": "Thế cờ 1 đến 8 là thế nền tảng, mỗi thế chỉ có một nước đúng. Các thế sau là puzzle Lichess, xếp theo rating tăng dần."}, {"t": "positions", "items": [{"fen": "8/8/8/8/P7/5k2/8/7K b - - 0 1", "moves": [], "q": "Quy tắc hình vuông. Đen đi. Chỉ có một nước giữ được hòa, đó là nước nào?", "o": ["Ke4", "Kf2", "Kg4", "Kf4"], "a": 0, "e": "Tốt a4 có hình vuông từ a4 đến e8. Ke4 đưa Vua đen vào trong hình vuông nên đuổi kịp Tốt. (Đối chiếu tablebase Lichess: chỉ Ke4 giữ hòa.) Chủ đề: tàn cuộc Tốt.", "id": "b16-5ccee22b"}, {"fen": "8/8/8/8/7P/2k5/8/K7 b - - 0 1", "moves": [], "q": "Quy tắc hình vuông. Đen đi. Chỉ có một nước giữ được hòa, đó là nước nào?", "o": ["Kd4", "Kd3", "Kc2", "Kc4"], "a": 0, "e": "Tốt h4 có hình vuông từ h4 đến d8. Kd4 vừa bước vào hình vuông nên Vua đen đuổi kịp. (Đối chiếu tablebase Lichess: chỉ Kd4 giữ hòa.) Chủ đề: tàn cuộc Tốt.", "id": "b16-622ca091"}, {"fen": "8/8/4k3/8/4PK2/8/8/8 b - - 0 1", "moves": [], "q": "Đối đầu khi phòng thủ. Đen đi. Chỉ có một nước giữ được hòa, đó là nước nào?", "o": ["Kf6", "Kf7", "Ke7", "Kd6"], "a": 0, "e": "Kf6 giành đối đầu: hai Vua đứng cùng cột, cách nhau một ô và Trắng phải đi. Vua trắng không tiến lên được. (Đối chiếu tablebase Lichess: chỉ Kf6 giữ hòa.) Chủ đề: tàn cuộc Tốt.", "id": "b16-4afd8388"}, {"fen": "8/3k4/8/8/3KP3/8/8/8 w - - 0 1", "moves": [], "q": "Giành đối đầu khi tấn công. Trắng đi. Chỉ có một nước thắng, đó là nước nào?", "o": ["Kd5", "Kd3", "Ke5", "Kc5"], "a": 0, "e": "Vua đi trước Tốt. Kd5 giành đối đầu, Vua đen buộc phải né sang một bên và Vua trắng tiến tiếp. (Đối chiếu tablebase Lichess: chỉ Kd5 thắng.) Chủ đề: tàn cuộc Tốt.", "id": "b16-8a12fffe"}, {"fen": "3k4/8/2K5/3P4/8/8/8/8 w - - 0 1", "moves": [], "q": "Giành đối đầu khi tấn công. Trắng đi. Chỉ có một nước thắng, đó là nước nào?", "o": ["Kd6", "Kc5", "Kb6", "Kb7"], "a": 0, "e": "Kd6 giành đối đầu và giữ Vua trắng đứng trước Tốt. Đẩy Tốt vội sẽ mất thắng. (Đối chiếu tablebase Lichess: chỉ Kd6 thắng.) Chủ đề: tàn cuộc Tốt.", "id": "b16-84f64588"}, {"fen": "6k1/8/5K2/6P1/8/8/8/8 w - - 0 1", "moves": [], "q": "Ô then chốt. Trắng đi. Chỉ có một nước thắng, đó là nước nào?", "o": ["Kg6", "Ke6", "Ke5", "Ke7"], "a": 0, "e": "Kg6 chiếm đối đầu trên hàng 6, trước Tốt. Đẩy Tốt lúc này chỉ còn hòa. (Đối chiếu tablebase Lichess: chỉ Kg6 thắng.) Chủ đề: tàn cuộc Tốt.", "id": "b16-eb52f10f"}, {"fen": "2k5/8/2PK4/2P5/8/8/8/8 w - - 0 1", "moves": [], "q": "Nhịp của Tốt. Trắng đi. Chỉ có một nước thắng, đó là nước nào?", "o": ["c7", "Ke5", "Kd5", "Ke6"], "a": 0, "e": "Sau c7, Đen chỉ còn một nước hợp lệ là Kb7. Trắng đi tiếp Kd7 và hộ tống Tốt c7 phong cấp. (Đối chiếu tablebase Lichess: chỉ c7 thắng.) Chủ đề: tàn cuộc Tốt.", "id": "b16-c09cdfdf"}, {"fen": "3k4/8/1K6/P7/8/8/8/8 b - - 0 1", "moves": [], "q": "Tốt cột biên. Đen đi. Chỉ có một nước giữ được hòa, đó là nước nào?", "o": ["Kc8", "Ke7", "Kd7", "Ke8"], "a": 0, "e": "Kc8 giữ Vua đen ở gần góc a8 và không cho Vua trắng kiểm soát đường tới ô phong cấp. Với Tốt cột biên, Vua phòng thủ giữ được góc thì hòa. (Đối chiếu tablebase Lichess: chỉ Kc8 giữ hòa.) Chủ đề: tàn cuộc Tốt.", "id": "b16-75cd23b7"}, {"fen": "8/8/4kpp1/7p/4KP1P/6P1/8/8 w - - 3 47", "moves": ["Kd4"], "q": "Puzzle Lichess #xo5KE (rating 1836). Tìm nước đi đầu tiên.", "o": ["Kf5", "Kf7", "Ke7", "Kd6"], "a": 0, "e": "Lời giải: 47...Kf5 48.Ke3 Kg4 49.Kf2 Kh3 50.f5 gxf5. Chủ đề: zugzwang, tàn cuộc Tốt.", "id": "b16-c969a898"}, {"fen": "8/7p/2k1p3/1p2P1K1/1P6/8/7P/8 w - - 4 43", "moves": ["Kf6"], "q": "Puzzle Lichess #cgQDv (rating 1843). Tìm nước đi đầu tiên.", "o": ["Kd5", "Kb7", "Kd7", "Kb6"], "a": 0, "e": "Lời giải: 43...Kd5 44.h3 h6 45.Kg6 Kxe5. Chủ đề: zugzwang, nước yên tĩnh, tàn cuộc Tốt.", "id": "b16-2e956cf4"}, {"fen": "8/pp6/2p4p/2Pk4/1P3P2/P2K4/8/8 b - - 0 43", "moves": ["b6"], "q": "Puzzle Lichess #xbtPn (rating 1863). Tìm nước đi đầu tiên.", "o": ["cxb6", "f5", "a4", "b5"], "a": 0, "e": "Lời giải: 44.cxb6 axb6 45.a4. Chủ đề: tàn cuộc Tốt, nước phòng thủ.", "id": "b16-5698449b"}, {"fen": "8/4k2p/4ppp1/4P3/3K1PPP/8/8/8 b - - 1 46", "moves": ["f5"], "q": "Puzzle Lichess #0iVRN (rating 1870). Tìm nước đi đầu tiên.", "o": ["gxf5", "g5", "h5", "Ke3"], "a": 0, "e": "Lời giải: 47.gxf5 exf5 48.Kd5 h6 49.e6. Chủ đề: tàn cuộc Tốt.", "id": "b16-3bcac30a"}, {"fen": "8/8/p7/Pp2P2p/1P4p1/3K2k1/8/8 b - - 0 48", "moves": ["Kf4"], "q": "Puzzle Lichess #6U7hw (rating 1891). Tìm nước đi đầu tiên.", "o": ["e6", "Kd2", "Kd4", "Kc2"], "a": 0, "e": "Lời giải: 49.e6 g3 50.Ke2. Chủ đề: tàn cuộc Tốt, nước phòng thủ.", "id": "b16-530f9655"}, {"fen": "8/8/4k1p1/1p2P2p/p1pPp2P/P5P1/1P1K4/8 w - - 1 47", "m
