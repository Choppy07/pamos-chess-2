<script>window.LESSON = {"so": 1, "ngay": "2026-11-26", "title": "Mô-típ chiếu hết cổ điển", "lead": "Các thế chiếu hết lặp đi lặp lại trong hàng nghìn ván. Buổi này nhận diện sáu kiểu chiếu hết cổ điển nâng cao, rồi tính chiếu hết trong hai nước trên puzzle Lichess rating 1800 đến 2000.", "prev": null, "next": {"file": "buoi-02.html", "title": "Buổi 2"}, "keyPoints": ["Chiếu hết trong 2: Chiếu hết trong hai nước.", "Chiếu hết móc: Chiếu hết bằng Xe, Mã và Tốt, trong đó một Tốt của đối phương chặn đường thoát của Vua.", "Chiếu hết Anastasia: Mã cùng Xe hoặc Hậu dồn Vua đối phương vào giữa cạnh bàn và một quân của chính nó.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Chiếu hết trong 2 (Mate in 2)"}, {"t": "p", "html": "Chiếu hết trong hai nước. <em>Dấu hiệu:<\/em> Liệt kê mọi nước chiếu và với mỗi nước đếm ô thoát của Vua. Nước yên tĩnh cắt hết ô thoát cũng đáng xét."}, {"t": "h3", "text": "Chiếu hết móc (Hook mate)"}, {"t": "p", "html": "Chiếu hết bằng Xe, Mã và Tốt, trong đó một Tốt của đối phương chặn đường thoát của Vua. <em>Dấu hiệu:<\/em> Xe chiếu hết được Mã bảo vệ, Mã lại được Tốt bảo vệ, còn Vua bị chính Tốt của nó chặn một ô thoát."}, {"t": "h3", "text": "Chiếu hết Anastasia (Anastasia's mate)"}, {"t": "p", "html": "Mã cùng Xe hoặc Hậu dồn Vua đối phương vào giữa cạnh bàn và một quân của chính nó. <em>Dấu hiệu:<\/em> Vua đứng sát cạnh bàn, một quân của nó chặn đường sang bên, Mã khóa các ô còn lại và Xe hoặc Hậu chiếu dọc cột."}, {"t": "h3", "text": "Chiếu hết Ả Rập (Arabian mate)"}, {"t": "p", "html": "Mã và Xe phối hợp dồn Vua đối phương vào một góc bàn cờ. <em>Dấu hiệu:<\/em> Vua bị dồn vào góc, Xe chiếu sát Vua và Mã vừa bảo vệ Xe vừa khóa ô thoát cuối."}, {"t": "h3", "text": "Chiếu hết Boden (Boden's mate)"}, {"t": "p", "html": "Hai Tượng trên hai đường chéo cắt nhau chiếu hết Vua bị chính quân mình chặn. <em>Dấu hiệu:<\/em> Hay gặp khi Vua đã nhập thành dài và quân quanh nó cản đường thoát; hai Tượng nhắm vào Vua từ hai đường chéo."}, {"t": "h3", "text": "Chiếu hết đuôi én (Dovetail mate)"}, {"t": "p", "html": "Hậu chiếu hết một Vua đứng sát, mà hai ô thoát duy nhất của nó đều bị chính quân mình chặn. <em>Dấu hiệu:<\/em> Hậu đứng sát Vua nên cần một quân khác bảo vệ, nếu không Vua sẽ ăn Hậu."}, {"t": "h3", "text": "Chiếu hết hai Tượng (Double bishop mate)"}, {"t": "p", "html": "Hai Tượng trên hai đường chéo kề nhau chiếu hết Vua bị chính quân mình chặn. <em>Dấu hiệu:<\/em> Hai Tượng đứng cạnh nhau, một Tượng chiếu và Tượng kia khóa các ô thoát."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "replay", "title": "Puzzle mẫu #rqrKm", "fen": "r7/5R2/2k5/3n4/1pNP4/1P1N4/PKP2PP1/5r2 b - - 2 39", "moves": ["Rxa2+", "Kxa2", "Nc3+", "Kb2", "Rb1#"], "intro": "Trắng vừa đi Nd3. Đen đi. Puzzle Lichess #rqrKm, rating 1830. Chủ đề: chiếu hết móc, thu hút, chiếu hết trong 3.", "notes": {"1": "Đen: Xe ăn Tốt ở a2, chiếu.", "2": "Trắng: Vua ăn Xe ở a2.", "3": "Đen: Mã đi tới c3, chiếu.", "4": "Trắng: Vua đi tới b2.", "5": "Đen: Xe đi tới b1, chiếu hết."}}]}, {"id": "the-co", "nav": "Bài tập", "tag": "Bài tập 1800–2000", "h": "Thế cờ cấp 1800 đến 2000", "blocks": [{"t": "p", "html": "Puzzle Lichess có rating từ 1800 đến 2000 (hoặc sát mức đó). Chọn nước đi đầu tiên rồi xem lời giải. Hãy tính hết biến trước khi trả lời."}, {"t": "positions", "items": [{"fen": "r1b1r1k1/pp1p1Npp/2p2q2/2bn3Q/2B5/3P4/PPP2PPP/R1B2RK1 w - - 0 12", "moves": ["Bxd5"], "q": "Puzzle Lichess #01qh2 (rating 1876). Tìm nước đi đầu tiên.", "o": ["Qxf2+", "Bxf2+", "Qxf7", "Qxb2"], "a": 0, "e": "Lời giải: 12...Qxf2+ 13.Kh1 Qxf1#. Chủ đề: dẫn dụ, chiếu hết trong 2, tấn công cánh Vua.", "id": "b1-588b7a17"}, {"fen": "r2q2rk/pp4p1/2nbb2B/7Q/3pp3/8/PPP3PP/R4RK1 b - - 0 20", "moves": ["Bg4"], "q": "Puzzle Lichess #jQHpy (rating 1889). Tìm nước đi đầu tiên.", "o": ["Bxg7+", "Bg5+", "Be3+", "Bc1+"], "a": 0, "e": "Lời giải: 21.Bxg7+ Kxg7 22.Rf7#. Chủ đề: chiếu hết trong 2, thu hút, hy sinh.", "id": "b1-c534eba2"}, {"fen": "r3k3/pp1b1N2/2n1pQ2/8/1qpP4/1P2P1P1/2B1KPP1/R4N1r b q - 2 21", "moves": ["cxb3"], "q": "Puzzle Lichess #hCFR1 (rating 1872). Tìm nước đi đầu tiên.", "o": ["Nd6+", "Qxe6+", "Rxa7", "Bxb3"], "a": 0, "e": "Lời giải: 22.Nd6+ Qxd6 23.Bg6#. Chủ đề: chiếu hết trong 2, hy sinh.", "id": "b1-5cf96985"}, {"fen": "8/6R1/1Qb4k/3p1ppp/3B1n2/2P2PnP/6P1/4r1K1 w - - 4 52", "moves": ["Kf2"], "q": "Puzzle Lichess #NgK9a (rating 1965). Tìm nước đi đầu tiên.", "o": ["Re2+", "Nxh3+", "Rf1+", "Nxg2"], "a": 0, "e": "Lời giải: 52...Re2+ 53.Kxg3 Rxg2#. Chủ đề: chiếu hết móc, chiếu hết trong 2, hy sinh.", "id": "b1-09ba3e5e"}, {"fen": "6k1/p1N2rp1/3p4/1p6/1PnR2P1/P5P1/6KP/8 w - - 1 27", "moves": ["Nxb5"], "q": "Puzzle Lichess #iuGHU (rating 1914). Tìm nước đi đầu tiên.", "o": ["Ne3+", "Nxa3", "Nb2", "Nd2"], "a": 0, "e": "Lời giải: 27...Ne3+ 28.Kh3 g5 29.Rxd6 Rh7+ 30.Rh6 Rxh6#. Chủ đề: dọn đường, nước yên tĩnh, chiếu hết trong 4.", "id": "b1-dfd7b970"}, {"fen": "2krr3/pp3ppp/2n5/8/2QNq3/4P2P/PP3KP1/R4B1R w - - 1 19", "moves": ["Nxc6"], "q": "Puzzle Lichess #jdfN9 (rating 1808). Tìm nước đi đầu tiên.", "o": ["Qxe3#", "Qxg2+", "Qxc6", "Qxc4"], "a": 0, "e": "Lời giải: 19...Qxe3#. Chủ đề: chiếu hết trong 1, chiếu hết đuôi én.", "id": "b1-0c362f0d"}]}]}, {"id": "quiz", "nav": "Quiz", "tag": "Quiz", "h": "Kiểm tra cuối buổi", "blocks": [{"t": "quiz", "items": [{"fen": "r1b4k/1p3B1p/p1n2n2/6R1/4P3/4B3/1q4PP/3R2K1 b - - 0 21", "moves": ["Qc2", "Rd8+", "Nxd8"], "q": "Puzzle Lichess #ZAN8y (rating 2045). Lời giải mở đầu 22.Rd8+ Nxd8. Trắng đi: nước tiếp theo?", "o": ["Rg8+", "Rd5", "Rf5", "Re5"], "a": 0, "e": "Lời giải đầy đủ: 22.Rd8+ Nxd8 23.Rg8+ Nxg8 24.Bd4+ Nf6 25.Bxf6#. Chủ đề: hy sinh, chiếu hết trong 4, chiếu hết hai Tượng.", "id": "b1-433f0d7a"}, {"fen": "5k2/5pr1/p7/1pb1N3/8/2P4P/1PB2PP1/2q1RK2 b - - 7 33", "moves": ["Qxc2", "Nd7+", "Kg8"], "q": "Puzzle Lichess #hRKe3 (rating 1949). Lời giải mở đầu 34.Nd7+ Kg8. Trắng đi: nước tiếp theo?", "o": ["Nf6+", "Nxc5", "Nb6", "Nf8"], "a": 0, "e": "Lời giải đầy đủ: 34.Nd7+ Kg8 35.Nf6+ Kh8 36.Re8+ Bf8 37.Rxf8+ Rg8 38.Rxg8#. Chủ đề: đòn đôi, chiếu hết Ả Rập, chiếu hết trong 5.", "id": "b1-ec22415c"}, {"fen": "2n3kr/1pr1pR2/3p2p1/p2P2N1/P1P4Q/1q6/6PP/5RK1 b - - 2 29", "moves": ["Rxh4", "Rf8+", "Kg7"], "q": "Puzzle Lichess #1M6gJ (rating 2047). Lời giải mở đầu 30.Rf8+ Kg7. Trắng đi: nước tiếp theo?", "o": ["Ne6+", "Rxc8", "Nf3", "Ne4"], "a": 0, "e": "Lời giải đầy đủ: 30.Rf8+ Kg7 31.Ne6+ Kh7 32.R1f7+ Kh6 33.Rh8#. Chủ đề: Vua bị lộ, đòn đôi, chiếu hết trong 4.", "id": "b1-10462ba8"}, {"q": "Chủ đề “Chiếu hết trong 2” (Lichess: Mate in 2) mô tả điều gì?", "o": ["Chiếu hết trong hai nước.", "Phong cấp một Tốt thành Hậu, Xe hoặc quân nhẹ.", "Nắm bắt cơ hội để có lợi thế quyết định (đánh giá từ 200 đến 600 centipawn).", "Đòn dùng luật bắt Tốt qua đường, khi một Tốt ăn được Tốt đối phương vừa đi hai ô ngay cạnh nó."], "a": 0, "e": "Theo Lichess: Chiếu hết trong hai nước.", "id": "b1-16dd07db"}, {"q": "Chủ đề “Chiếu hết móc” (Lichess: Hook mate) mô tả điều gì?", "o": ["Chiếu hết bằng Xe, Mã và Tốt, trong đó một Tốt của đối phương chặn đường thoát của Vua.", "Một nước hoặc chuỗi nước chính xác cần để tránh mất vật chất hoặc lợi thế khác.", "Tàn cuộc chỉ có Tượng và Tốt (cùng hai Vua).", "Phong cấp một Tốt thành Hậu, Xe hoặc quân nhẹ."], "a": 0, "e": "Theo Lichess: Chiếu hết bằng Xe, Mã và Tốt, trong đó một Tốt của đối phương chặn đường thoát của Vua.", "id": "b1-bd4589e8"}]}]}, {"id": "lien-ket", "nav": "Liên kết", "tag": "Liên kết ngoài", "h": "Ôn tập trên Lichess đúng nội dung buổi này", "blocks": [{"t": "links", "items": [{"k": "Luyện tập", "t": "Practice: Checkmate Patterns I", "href": "https://lichess.org/practice/checkmates/practicestnamcheckmatepatternsi/fE4k21MW", "d": "Phần Practice “Checkmate Patterns I” của Lichess."}, {"k": "Luyện tập", "t": "Practice: Checkmate Patterns III", "href": "https://lichess.org/practice/checkmates/practicestnamcheckmatepatternsiii/PDkQDt6u", "d": "Phần Practice “Checkmate Patterns III” của Lichess."}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Mate in 2", "href": "https://lichess.org/training/mateIn2", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết trong 2. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Hook mate", "href": "https://lichess.org/training/hookMate", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết móc. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Anastasia's mate", "href": "https://lichess.org/training/anastasiaMate", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết anastasia. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Arabian mate", "href": "https://lichess.org/training/arabianMate", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết ả rập. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Boden's mate", "href": "https://lichess.org/training/bodenMate", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết boden. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Dovetail mate", "href": "https://lichess.org/training/dovetailMate", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết đuôi én. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Double bishop mate", "href": "https://lichess.org/training/doubleBishopMate", "d": "Luyện puzzle Lichess theo chủ đề chiếu hết hai tượng. "}, {"k": "Puzzle", "t": "Tất cả chủ đề puzzle của Lichess", "href": "https://lichess.org/training/themes", "d": "Danh sách chủ đề puzzle kèm mô tả chính thức, nguồn của các định nghĩa trong buổi này."}]}, {"t": "h3", "text": "Puzzle đã dùng trong bài tập"}, {"t": "links", "items": [{"k": "Puzzle", "t": "Puzzle #rqrKm", "href": "https://lichess.org/training/rqrKm", "d": "Rating 1830. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #01qh2", "href": "https://lichess.org/training/01qh2", "d": "Rating 1876. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #jQHpy", "href": "https://lichess.org/training/jQHpy", "d": "Rating 1889. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #hCFR1", "href": "https://lichess.org/training/hCFR1", "d": "Rating 1872. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #NgK9a", "href": "https://lichess.org/training/NgK9a", "d": "Rating 1965. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #iuGHU", "href": "https://lichess.org/training/iuGHU", "d": "Rating 1914. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #jdfN9", "href": "https://lichess.org/training/jdfN9", "d": "Rating 1808. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #ZAN8y", "href": "https://lichess.org/training/ZAN8y", "d": "Rating 2045. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #hRKe3", "href": "https://lichess.org/training/hRKe3", "d": "Rating 1949. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #1M6gJ", "href": "https://lichess.org/training/1M6gJ", "d": "Rating 2047. Mở trên Lichess để xem lại và thử biến khác."}]}, {"t": "h3", "text": "Bài về nhà"}, {"t": "ul", "items": ["Giải 10 puzzle cho mỗi chủ đề chiếu hết trong 2, chiếu hết móc, chiếu hết anastasia trên Lichess và ghi lại thế bạn đã bỏ sót.", "Với mỗi puzzle sai, viết ra nước đáp của đối phương mà bạn đã không tính tới.", "Chọn một ván gần đây của bạn và tìm thế cờ có thể áp dụng chủ đề của buổi này."]}]}]};</script>
