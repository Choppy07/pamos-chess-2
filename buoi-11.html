<script>window.LESSON = {"so": 11, "ngay": "2027-02-04", "title": "Tốt tiến sâu, phong cấp và bắt Tốt qua đường", "lead": "Tốt gần ô phong cấp làm đối phương mất cân bằng. Buổi này luyện tính phong cấp, phong cấp thấp và các đòn dùng luật bắt Tốt qua đường.", "prev": {"file": "buoi-10.html", "title": "Buổi 10"}, "next": {"file": "buoi-12.html", "title": "Buổi 12"}, "keyPoints": ["Tốt tiến sâu: Một Tốt của bạn đã vào sâu phần cờ đối phương, có thể đe dọa phong cấp.", "Phong cấp: Phong cấp một Tốt thành Hậu, Xe hoặc quân nhẹ.", "Phong cấp thấp: Phong cấp thành Mã, Tượng hoặc Xe.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Tốt tiến sâu (Advanced pawn)"}, {"t": "p", "html": "Một Tốt của bạn đã vào sâu phần cờ đối phương, có thể đe dọa phong cấp. <em>Dấu hiệu:<\/em> Tốt ở hàng 6 hoặc hàng 7 trói quân đối phương vào việc canh ô phong cấp. Hãy tìm nước dọn đường hoặc chiếu để đẩy nó lên."}, {"t": "h3", "text": "Phong cấp (Promotion)"}, {"t": "p", "html": "Phong cấp một Tốt thành Hậu, Xe hoặc quân nhẹ. <em>Dấu hiệu:<\/em> Tính xem ô phong cấp có bị khống chế không. Hy sinh để dọn đường hoặc dẫn dụ quân canh là mô-típ rất hay gặp."}, {"t": "h3", "text": "Phong cấp thấp (Underpromotion)"}, {"t": "p", "html": "Phong cấp thành Mã, Tượng hoặc Xe. <em>Dấu hiệu:<\/em> Phong cấp Mã có thể chiếu hoặc tạo đòn đôi. Phong cấp Xe hoặc Tượng có thể tránh hòa cờ bí."}, {"t": "h3", "text": "Bắt Tốt qua đường (En passant)"}, {"t": "p", "html": "Đòn dùng luật bắt Tốt qua đường, khi một Tốt ăn được Tốt đối phương vừa đi hai ô ngay cạnh nó. <em>Dấu hiệu:<\/em> Luật chỉ áp dụng ngay nước kế tiếp. Nó có thể mở cột, loại Tốt bảo vệ hoặc cứu một thế bí."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "replay", "title": "Puzzle mẫu #F8hrb", "fen": "7r/5p1P/P7/8/5K2/3k3R/4p3/8 b - - 1 49", "moves": ["Kd2", "Rh1", "Rxh7", "Rxh7", "e1=Q"], "intro": "Trắng vừa đi Rh3+. Đen đi. Puzzle Lichess #F8hrb, rating 1950. Chủ đề: dẫn dụ, Tốt tiến sâu, tàn cuộc Xe.", "notes": {"1": "Đen: Vua đi tới d2.", "2": "Trắng: Xe đi tới h1.", "3": "Đen: Xe ăn Tốt ở h7.", "4": "Trắng: Xe ăn Xe ở h7.", "5": "Đen: Tốt đi tới e1, phong cấp thành Hậu."}}]}, {"id": "the-co", "nav": "Bài tập", "tag": "Bài tập 1800–2000", "h": "Thế cờ cấp 1800 đến 2000", "blocks": [{"t": "p", "html": "Puzzle Lichess có rating từ 1800 đến 2000 (hoặc sát mức đó). Chọn nước đi đầu tiên rồi xem lời giải. Hãy tính hết biến trước khi trả lời."}, {"t": "positions", "items": [{"fen": "8/3Pb3/1pB4p/1P6/6P1/4kp1K/8/8 w - - 0 59", "moves": ["Kg3"], "q": "Puzzle Lichess #4wVV5 (rating 1948). Tìm nước đi đầu tiên.", "o": ["f2", "Bh4+", "h5", "Bd6+"], "a": 0, "e": "Lời giải: 59...f2 60.Bg2 Ke2. Chủ đề: Tốt tiến sâu, tàn cuộc Tượng, nước phòng thủ.", "id": "b11-71b8c7a8"}, {"fen": "4B3/p7/5p2/PPk3b1/6K1/8/8/8 b - - 4 49", "moves": ["Bd2"], "q": "Puzzle Lichess #Upy3r (rating 1822). Tìm nước đi đầu tiên.", "o": ["b6", "a6", "Bc6", "Bh5"], "a": 0, "e": "Lời giải: 50.b6 axb6 51.a6 b5 52.a7. Chủ đề: Tốt tiến sâu, tàn cuộc Tượng.", "id": "b11-ae5c4517"}, {"fen": "5R2/1k1r4/7p/B1p3p1/P5P1/1P1p3P/4rRK1/8 w - - 1 50", "moves": ["Rd8"], "q": "Puzzle Lichess #pNe9x (rating 1843). Tìm nước đi đầu tiên.", "o": ["Rxd8", "Rxf2+", "Re5", "Rd5"], "a": 0, "e": "Lời giải: 50...Rxd8 51.Bxd8 d2 52.Rxe2 d1=Q. Chủ đề: Tốt tiến sâu, phong cấp.", "id": "b11-5b158207"}, {"fen": "2r5/8/2P2kpp/RP3p2/1P1n4/6P1/5P1P/6K1 b - - 0 52", "moves": ["Nc2"], "q": "Puzzle Lichess #fRJw6 (rating 1957). Tìm nước đi đầu tiên.", "o": ["b6", "g4", "f4", "h3"], "a": 0, "e": "Lời giải: 53.b6 Rxc6 54.b7 Rb6 55.Ra6 Rxa6 56.b8=Q. Chủ đề: Tốt tiến sâu, phong cấp, đòn ghim.", "id": "b11-bf90634f"}, {"fen": "1r1r1k2/RN3pp1/2Pp3p/4p3/1p6/2P5/1P3P1P/6K1 b - - 0 38", "moves": ["Ra8"], "q": "Puzzle Lichess #e2u6l (rating 1896). Tìm nước đi đầu tiên.", "o": ["c7", "cxb4", "Nxd8", "Nxd6"], "a": 0, "e": "Lời giải: 39.c7 Rdc8 40.Rxa8 Rxa8 41.Nxd6 bxc3 42.bxc3 Ke7 43.c8=Q Rxc8 44.Nxc8+. Chủ đề: Tốt tiến sâu, phong cấp, đòn ghim.", "id": "b11-7cd23ee4"}, {"fen": "6k1/5pn1/P2b1Q1p/8/2B1P3/r6P/1p4PK/8 w - - 1 38", "moves": ["e5"], "q": "Puzzle Lichess #zFPT1 (rating 1837). Tìm nước đi đầu tiên.", "o": ["Bxe5+", "Rxh3+", "Rxa6", "Bb8"], "a": 0, "e": "Lời giải: 38...Bxe5+ 39.Qxe5 b1=Q. Chủ đề: Tốt tiến sâu, phong cấp.", "id": "b11-876c95f4"}, {"fen": "8/5q1k/1b3r1p/p3QN2/3p2p1/P2P2P1/1P2PPK1/7R w - - 3 42", "moves": ["e4"], "q": "Puzzle Lichess #2S2LS (rating 1819). Tìm nước đi đầu tiên.", "o": ["dxe3", "Rxf5", "h5", "a4"], "a": 0, "e": "Lời giải: 42...dxe3 43.fxe3 Rxf5. Chủ đề: bắt Tốt qua đường.", "id": "b11-00d25263"}]}]}, {"id": "quiz", "nav": "Quiz", "tag": "Quiz", "h": "Kiểm tra cuối buổi", "blocks": [{"t": "quiz", "items": [{"fen": "8/5p2/2k1p1pp/p1P1P3/P2K2PP/8/8/8 b - - 1 36", "moves": ["g5", "hxg5", "hxg5"], "q": "Puzzle Lichess #LWcWI (rating 1999). Lời giải mở đầu 37.hxg5 hxg5. Trắng đi: nước tiếp theo?", "o": ["Kc4", "Ke3", "Kc3", "Ke4"], "a": 0, "e": "Lời giải đầy đủ: 37.hxg5 hxg5 38.Kc4 Kc7 39.Kb5 f5 40.exf6. Chủ đề: bắt Tốt qua đường, zugzwang, tàn cuộc Tốt.", "id": "b11-aebc27a0"}, {"fen": "8/3P1k2/1Q2p3/p3q2p/P7/5nPP/1P3PK1/8 b - - 2 32", "moves": ["Qd5", "d8=N+", "Kf6"], "q": "Puzzle Lichess #dTrIv (rating 1945). Lời giải mở đầu 33.d8=N+ Kf6. Trắng đi: nước tiếp theo?", "o": ["Qxe6+", "Qxa5", "Qd4+", "Nxe6"], "a": 0, "e": "Lời giải đầy đủ: 33.d8=N+ Kf6 34.Qxe6+ Qxe6 35.Nxe6 Ne1+ 36.Kf1. Chủ đề: Tốt tiến sâu, phong cấp thấp, phong cấp.", "id": "b11-8c015b8d"}, {"fen": "3bB3/3P4/1p2k2p/p1p1p3/r3P3/2RP2P1/5K2/8 b - - 3 38", "moves": ["Bg5", "d8=N+", "Bxd8"], "q": "Puzzle Lichess #Y5oJu (rating 1965). Lời giải mở đầu 39.d8=N+ Bxd8. Trắng đi: nước tiếp theo?", "o": ["Bxa4", "Bf7+", "Bd7+", "Rxc5"], "a": 0, "e": "Lời giải đầy đủ: 39.d8=N+ Bxd8 40.Bxa4. Chủ đề: Tốt tiến sâu, phong cấp, tấn công khám phá.", "id": "b11-0906fdea"}, {"q": "Chủ đề “Tốt tiến sâu” (Lichess: Advanced pawn) mô tả điều gì?", "o": ["Một Tốt của bạn đã vào sâu phần cờ đối phương, có thể đe dọa phong cấp.", "Tàn cuộc chỉ có Xe và Tốt (cùng hai Vua).", "Loại bỏ quân giữ vai trò then chốt trong việc bảo vệ một quân khác, rồi ăn quân vừa hết bảo vệ ở nước sau.", "Nước không chiếu, không ăn quân và không tạo đe dọa ăn ngay, mà chuẩn bị một đe dọa ẩn và không tránh được cho nước sau."], "a": 0, "e": "Theo Lichess: Một Tốt của bạn đã vào sâu phần cờ đối phương, có thể đe dọa phong cấp.", "id": "b11-96d7228f"}, {"q": "Chủ đề “Phong cấp” (Lichess: Promotion) mô tả điều gì?", "o": ["Phong cấp một Tốt thành Hậu, Xe hoặc quân nhẹ.", "Một quân tấn công hoặc bảo vệ một ô xuyên qua quân đối phương.", "Đổi quân hoặc hy sinh để buộc hoặc dụ một quân đối phương tới ô cho phép đòn tiếp theo.", "Tấn công tập trung vào Tốt f2 hoặc f7, như trong khai cuộc Fried Liver."], "a": 0, "e": "Theo Lichess: Phong cấp một Tốt thành Hậu, Xe hoặc quân nhẹ.", "id": "b11-f5dbd19d"}]}]}, {"id": "lien-ket", "nav": "Liên kết", "tag": "Liên kết ngoài", "h": "Ôn tập trên Lichess đúng nội dung buổi này", "blocks": [{"t": "links", "items": [{"k": "Luyện tập", "t": "Practice: Underpromotion", "href": "https://lichess.org/practice/advanced-tactics/practicestnamunderpromotion/49fDW0wP", "d": "Phần Practice “Underpromotion” của Lichess."}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Advanced pawn", "href": "https://lichess.org/training/advancedPawn", "d": "Luyện puzzle Lichess theo chủ đề tốt tiến sâu. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Promotion", "href": "https://lichess.org/training/promotion", "d": "Luyện puzzle Lichess theo chủ đề phong cấp. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Underpromotion", "href": "https://lichess.org/training/underPromotion", "d": "Luyện puzzle Lichess theo chủ đề phong cấp thấp. "}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: En passant", "href": "https://lichess.org/training/enPassant", "d": "Luyện puzzle Lichess theo chủ đề bắt tốt qua đường. "}, {"k": "Puzzle", "t": "Tất cả chủ đề puzzle của Lichess", "href": "https://lichess.org/training/themes", "d": "Danh sách chủ đề puzzle kèm mô tả chính thức, nguồn của các định nghĩa trong buổi này."}]}, {"t": "h3", "text": "Puzzle đã dùng trong bài tập"}, {"t": "links", "items": [{"k": "Puzzle", "t": "Puzzle #F8hrb", "href": "https://lichess.org/training/F8hrb", "d": "Rating 1950. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #4wVV5", "href": "https://lichess.org/training/4wVV5", "d": "Rating 1948. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #Upy3r", "href": "https://lichess.org/training/Upy3r", "d": "Rating 1822. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #pNe9x", "href": "https://lichess.org/training/pNe9x", "d": "Rating 1843. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #fRJw6", "href": "https://lichess.org/training/fRJw6", "d": "Rating 1957. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #e2u6l", "href": "https://lichess.org/training/e2u6l", "d": "Rating 1896. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #zFPT1", "href": "https://lichess.org/training/zFPT1", "d": "Rating 1837. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #2S2LS", "href": "https://lichess.org/training/2S2LS", "d": "Rating 1819. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #LWcWI", "href": "https://lichess.org/training/LWcWI", "d": "Rating 1999. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #dTrIv", "href": "https://lichess.org/training/dTrIv", "d": "Rating 1945. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #Y5oJu", "href": "https://lichess.org/training/Y5oJu", "d": "Rating 1965. Mở trên Lichess để xem lại và thử biến khác."}]}, {"t": "h3", "text": "Bài về nhà"}, {"t": "ul", "items": ["Giải 10 puzzle cho mỗi chủ đề tốt tiến sâu, phong cấp, phong cấp thấp trên Lichess và ghi lại thế bạn đã bỏ sót.", "Với mỗi puzzle sai, viết ra nước đáp của đối phương mà bạn đã không tính tới.", "Chọn một ván gần đây của bạn và tìm thế cờ có thể áp dụng chủ đề của buổi này."]}]}]};</script>
