<script>window.LESSON = {"so": 10, "ngay": "2027-01-28", "title": "Dẫn dụ, chặn đường và dọn đường", "lead": "Ba mô-típ nhắm vào quan hệ giữa các quân phòng thủ. Buổi này luyện tìm quân bị quá tải, cắt liên lạc giữa hai quân và dọn ô cho quân mình.", "prev": {"file": "buoi-09.html", "title": "Buổi 9"}, "next": {"file": "buoi-11.html", "title": "Buổi 11"}, "keyPoints": ["Dẫn dụ: Nước đi làm một quân đối phương xao nhãng khỏi nhiệm vụ khác của nó, ví dụ giữ một ô then chốt. Đôi khi gọi là quá tải (overloading).", "Chặn đường: Đặt một quân vào giữa hai quân đối phương để một hoặc cả hai mất bảo vệ, ví dụ Mã trên ô được bảo vệ giữa hai Xe.", "Dọn đường: Nước đi, thường kèm nhịp, dọn một ô, cột hoặc đường chéo cho đòn chiến thuật tiếp theo.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Dẫn dụ (Deflection)"}, {"t": "p", "html": "Nước đi làm một quân đối phương xao nhãng khỏi nhiệm vụ khác của nó, ví dụ giữ một ô then chốt. Đôi khi gọi là quá tải (overloading). <em>Dấu hiệu:<\/em> Tìm quân phòng thủ đang gánh hai nhiệm vụ, rồi buộc nó bỏ một nhiệm vụ."}, {"t": "h3", "text": "Chặn đường (Interference)"}, {"t": "p", "html": "Đặt một quân vào giữa hai quân đối phương để một hoặc cả hai mất bảo vệ, ví dụ Mã trên ô được bảo vệ giữa hai Xe. <em>Dấu hiệu:<\/em> Tìm hai quân đối phương liên lạc với nhau qua một đường thẳng, rồi chen quân vào cắt liên lạc."}, {"t": "h3", "text": "Dọn đường (Clearance)"}, {"t": "p", "html": "Nước đi, thường kèm nhịp, dọn một ô, cột hoặc đường chéo cho đòn chiến thuật tiếp theo. <em>Dấu hiệu:<\/em> Dời quân mình khỏi ô then chốt bằng nước có nhịp (chiếu hoặc đe dọa) để quân sau chiếm ô đó."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "replay", "title": "Puzzle mẫu #jitea", "fen": "3q3k/1r3Q1p/2b2b1B/p1ppr3/1p6/P2P2R1/BPP3P1/R6K w - - 1 28", "moves": ["Rg8+", "Qxg8", "Qxf6+", "Rg7", "Qxe5"], "intro": "Đen vừa đi Rb7. Trắng đi. Puzzle Lichess #jitea, rating 1925. Chủ đề: dẫn dụ, đòn đôi, hy sinh.", "notes": {"1": "Trắng: Xe đi tới g8, chiếu.", "2": "Đen: Hậu ăn Xe ở g8.", "3": "Trắng: Hậu ăn Tượng ở f6, chiếu.", "4": "Đen: Xe đi tới g7.", "5": "Trắng: Hậu ăn Xe ở e5."}}]}, {"id": "the-co", "nav": "Bài tập", "tag": "Bài tập 1800–2000", "h": "Thế cờ cấp 1800 đến 2000", "blocks": [{"t": "p", "html": "Puzzle Lichess có rating từ 1800 đến 2000 (hoặc sát mức đó). Chọn nước đi đầu tiên rồi xem lời giải. Hãy tính hết biến trước khi trả lời."}, {"t": "positions", "items": [{"fen": "8/2R5/6pk/2p5/2p3PK/2r5/P7/8 w - - 0 45", "moves": ["Rxc5"], "q": "Puzzle Lichess #ZMMzY (rating 1889). Tìm nước đi đầu tiên.", "o": ["g5+", "Rh3+", "Rb3", "Kg7"], "a": 0, "e": "Lời giải: 45...g5+ 46.Rxg5 Rh3+ 47.Kxh3 Kxg5 48.Kg2 c3 49.Kf2 c2. Chủ đề: Tốt tiến sâu, tàn cuộc Xe, dẫn dụ.", "id": "b10-90dd5c4f"}, {"fen": "2b3k1/3p2p1/2pR3p/2P1PQ2/6PP/1q3K2/5B2/5r2 w - - 3 39", "moves": ["Rd3"], "q": "Puzzle Lichess #zIupx (rating 1891). Tìm nước đi đầu tiên.", "o": ["Qc2", "Qxd3+", "Rxf2+", "Qd1+"], "a": 0, "e": "Lời giải: 39...Qc2 40.Kg2 Rxf2+ 41.Qxf2 Qxd3. Chủ đề: dẫn dụ, đòn đôi.", "id": "b10-b2ed449b"}, {"fen": "3r1rk1/p3bpp1/1p2pn1p/3qB3/2pPR3/2P3Q1/PPB2PPP/3R2K1 b - - 5 18", "moves": ["Bd6"], "q": "Puzzle Lichess #f90w7 (rating 1975). Tìm nước đi đầu tiên.", "o": ["Qxg7+", "Bxf6", "Bxd6", "Qg4"], "a": 0, "e": "Lời giải: 19.Qxg7+ Kxg7 20.Rg4+ Kh8 21.Bxf6#. Chủ đề: dẫn dụ, thu hút, chiếu hết trong 3.", "id": "b10-4b1deb38"}, {"fen": "5q2/1k6/1pn5/5p2/5B2/6P1/8/3RR1K1 b - - 3 41", "moves": ["Qf6"], "q": "Puzzle Lichess #QsTgY (rating 1985). Tìm nước đi đầu tiên.", "o": ["Rd7+", "Re7+", "Rd4", "Rd5"], "a": 0, "e": "Lời giải: 42.Rd7+ Ka6 43.Rd6 Qb2 44.Rxc6. Chủ đề: chặn đường.", "id": "b10-a1f5bdb8"}, {"fen": "1k6/ppp2pr1/3p1p2/P3pP2/1P2P2q/2PP2rP/4QRPK/R7 w - - 9 29", "moves": ["Ra2"], "q": "Puzzle Lichess #jBeSi (rating 1965). Tìm nước đi đầu tiên.", "o": ["Rxh3+", "Rxg2+", "Rxd3", "Qxh3+"], "a": 0, "e": "Lời giải: 29...Rxh3+ 30.gxh3 Qg3+ 31.Kh1 Qg1#. Chủ đề: dọn đường, chiếu hết trong 3, hy sinh.", "id": "b10-d16c0d70"}, {"fen": "3r4/6pk/7p/2n2pq1/5R2/4R1P1/P1BrQP2/5K2 w - - 3 39", "moves": ["Rxf5"], "q": "Puzzle Lichess #7SnTt (rating 1938). Tìm nước đi đầu tiên.", "o": ["Rxe2", "Rxc2", "Rd1+", "Qxg3"], "a": 0, "e": "Lời giải: 39...Rxe2 40.Rxe2 Qc1+. Chủ đề: dọn đường.", "id": "b10-b1bc076f"}, {"fen": "r3k2r/4bp2/p2p4/3Pp2p/1p3p2/1q1B4/1P2Q1PP/R2R3K b kq - 3 26", "moves": ["a5"], "q": "Puzzle Lichess #3KpTI (rating 1962). Tìm nước đi đầu tiên.", "o": ["Bb5+", "Qxe5", "Qxh5", "Rxa5"], "a": 0, "e": "Lời giải: 27.Bb5+ Kf8 28.Rd3. Chủ đề: dọn đường.", "id": "b10-0dc3f2f7"}]}]}, {"id": "quiz", "nav": "Quiz", "tag": "Quiz", "h": "Kiểm tra cuối buổi", "blocks": [{"t": "quiz", "items": [{"fen": "6k1/1p3ppp/3bq1r1/1Q1R4/p3n3/P1P1PN2/1P5P/3RB1rK w - - 3 29", "moves": ["Nxg1", "Nf2+", "Bxf2"], "q": "Puzzle Lichess #MSXrm (rating 2000). Lời giải mở đầu 29...Nf2+ 30.Bxf2. Đen đi: nước tiếp theo?", "o": ["Qe4+", "Qxd5+", "Qxe3", "Rxg1+"], "a": 0, "e": "Lời giải đầy đủ: 29...Nf2+ 30.Bxf2 Qe4+ 31.Nf3 Qxf3#. Chủ đề: dọn đường, chiếu hết trong 3, hy sinh.", "id": "b10-b643ce0e"}, {"fen": "6k1/1p1q4/p2p4/2pP1p2/P2r2p1/2N4P/1PQ2P2/6RK w - - 4 36", "moves": ["hxg4", "Qh7+", "Kg2"], "q": "Puzzle Lichess #uJT9Q (rating 1875). Lời giải mở đầu 36...Qh7+ 37.Kg2. Đen đi: nước tiếp theo?", "o": ["Rxg4+", "Rxa4", "Rxd5", "fxg4"], "a": 0, "e": "Lời giải đầy đủ: 36...Qh7+ 37.Kg2 Rxg4+ 38.Kf3 Rxg1. Chủ đề: Vua bị lộ, dẫn dụ, đòn xiên.", "id": "b10-1f006a64"}, {"fen": "8/5p1k/r7/PR6/1K6/8/8/8 b - - 2 56", "moves": ["f6", "Rb6", "Ra8"], "q": "Puzzle Lichess #HddqX (rating 1909). Lời giải mở đầu 57.Rb6 Ra8. Trắng đi: nước tiếp theo?", "o": ["Rxf6", "Rb7+", "Rb5", "Re6"], "a": 0, "e": "Lời giải đầy đủ: 57.Rb6 Ra8 58.Rxf6. Chủ đề: tàn cuộc Xe, chặn đường.", "id": "b10-48c0f886"}, {"q": "Chủ đề “Dẫn dụ” (Lichess: Deflection) mô tả điều gì?", "o": ["Nước đi làm một quân đối phương xao nhãng khỏi nhiệm vụ khác của nó, ví dụ giữ một ô then chốt. Đôi khi gọi là quá tải (overloading).", "Phong cấp thành Mã, Tượng hoặc Xe.", "Quân giá trị cao bị tấn công, phải dời đi, rồi quân giá trị thấp hơn đứng sau bị ăn hoặc bị tấn công. Ngược lại với ghim.", "Đổi quân hoặc hy sinh để buộc hoặc dụ một quân đối phương tới ô cho phép đòn tiếp theo."], "a": 0, "e": "Theo Lichess: Nước đi làm một quân đối phương xao nhãng khỏi nhiệm vụ khác của nó, ví dụ giữ một ô then chốt. Đôi khi gọi là quá tải (overloading).", "id": "b10-507f13ef"}, {"q": "Chủ đề “Chặn đường” (Lichess: Interference) mô tả điều gì?", "o": ["Đặt một quân vào giữa hai quân đối phương để một hoặc cả hai mất bảo vệ, ví dụ Mã trên ô được bảo vệ giữa hai Xe.", "Hai Tượng trên hai đường chéo kề nhau chiếu hết Vua bị chính quân mình chặn.", "Hy sinh vật chất trong ngắn hạn để lấy lại lợi thế sau một chuỗi nước ép buộc.", "Chiếu hết trong ba nước."], "a": 0, "e": "Theo Lichess: Đặt một quân vào giữa hai quân đối phương để một hoặc cả hai mất bảo vệ, ví dụ Mã trên ô được bảo vệ giữa hai Xe.", "id": "b10-f7f67bda"}]}]}, {"id": "lien-ket", "nav": "Liên kết", "tag": "Liên kết ngoài", "h": "Ôn tập trên Lichess đúng nội dung buổi này", "blocks": [{"t": "links", "items": [{"k": "Luyện tập", "t": "Practice: Deflection", "href": "https://lichess.org/practice/advanced-tactics/practicestnamdeflection/kdKpaYLW", "d": "Phần Practice “Deflection” của Lichess."}, {"k": "Luyện tập", "t": "Practice: Interference", "href": "https://lichess.org/practice/advanced-tacti ess.org/training/7SnTt", "d": "Rating 1938. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #3KpTI", "href": "https://lichess.org/training/3KpTI", "d": "Rating 1962. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #MSXrm", "href": "https://lichess.org/training/MSXrm", "d": "Rating 2000. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #uJT9Q", "href": "https://lichess.org/training/uJT9Q", "d": "Rating 1875. Mở trên Lichess để xem lại và thử biến khác."}, {"k": "Puzzle", "t": "Puzzle #HddqX", "href": "https://lichess.org/training/HddqX", "d": "Rating 1909. Mở trên Lichess để xem lại và thử biến khác."}]}, {"t": "h3", "text": "Bài về nhà"}, {"t": "ul", "items": ["Giải 10 puzzle cho mỗi chủ đề dẫn dụ, chặn đường, dọn đường trên Lichess và ghi lại thế bạn đã bỏ sót.", "Với mỗi puzzle sai, viết ra nước đáp của đối phương mà bạn đã không tính tới.", "Chọn một ván gần đây của bạn và tìm thế cờ có thể áp dụng chủ đề của buổi này."]}]}]};</script>
