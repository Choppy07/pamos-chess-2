<script>window.LESSON = {"so": 7, "ngay": "2027-01-07", "title": "Bẫy quân và nước yên tĩnh", "lead": "Một quân bị bẫy hoặc một nước yên tĩnh chuẩn bị đe dọa không tránh được là hai loại đòn dễ bỏ sót nhất. Buổi này luyện tìm cả hai.", "prev": {"file": "buoi-06.html", "title": "Buổi 6"}, "next": {"file": "buoi-08.html", "title": "Buổi 8"}, "keyPoints": ["Bẫy quân: Quân không thể thoát khỏi bị ăn vì có quá ít nước đi.", "Nước yên tĩnh: Nước không chiếu, không ăn quân và không tạo đe dọa ăn ngay, mà chuẩn bị một đe dọa ẩn và không tránh được cho nước sau.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Bẫy quân (Trapped piece)"}, {"t": "p", "html": "Quân không thể thoát khỏi bị ăn vì có quá ít nước đi. <em>Dấu hiệu:<\/em> Quân đối phương ít ô đi và đang bị tấn công. Hay gặp ở Hậu hoặc Tượng đi sâu vào phe bạn và Mã ở rìa bàn."}, {"t": "h3", "text": "Nước yên tĩnh (Quiet move)"}, {"t": "p", "html": "Nước không chiếu, không ăn quân và không tạo đe dọa ăn ngay, mà chuẩn bị một đe dọa ẩn và không tránh được cho nước sau. <em>Dấu hiệu:<\/em> Tìm nước đưa thêm quân vào cuộc hoặc cắt ô thoát mà không chiếu. Loại nước này dễ bị bỏ sót nhất."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "replay", "title": "Puzzle mẫu #29ehz", "fen": "5r2/7p/p4Bk1/6P1/7P/4K3/PPP1p1r1/4R3 w - - 3 36", "moves": ["Kf3", "Rh2", "Kg3", "Rxh4", "Kxh4"], "intro": "Đen vừa đi Rg2. Trắng đi. P
