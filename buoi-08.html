<script>window.LESSON = {"so": 8, "ngay": "2027-01-14", "title": "Ghim, xiên và tia X", "lead": "Ba mô-típ cùng dựa vào đường thẳng và thứ tự giá trị quân. Buổi này luyện phân biệt và khai thác chúng ở độ khó 1800 đến 2000.", "prev": {"file": "buoi-07.html", "title": "Buổi 7"}, "next": {"file": "buoi-09.html", "title": "Buổi 9"}, "keyPoints": ["Ghim: Một quân không thể rời chỗ mà không để lộ đòn tấn công vào quân có giá trị cao hơn.", "Xiên: Quân giá trị cao bị tấn công, phải dời đi, rồi quân giá trị thấp hơn đứng sau bị ăn hoặc bị tấn công. Ngược lại với ghim.", "Tia X: Một quân tấn công hoặc bảo vệ một ô xuyên qua quân đối phương.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Ghim (Pin)"}, {"t": "p", "html": "Một quân không thể rời chỗ mà không để lộ đòn tấn công vào quân có giá trị cao hơn. <em>Dấu hiệu:<\/em> Ghim tuyệt đối vào Vua thì quân bị ghim không được đi. Ghim vào quân lớn thì được đi nhưng mất vật chất. Tấn công thêm vào quân bị ghim."}, {"t": "h3", "text": "Xiên (Skewer)"}, {"t": "p", "html": "Quân giá trị cao bị tấn công, phải dời đi, rồi quân giá trị thấp hơn đứng sau bị ăn hoặc bị tấn công. Ngược lại với ghim. <em>Dấu hiệu:<\/em> Tìm quân giá trị cao thẳng hàng với quân thấp hơn. Dùng nước chiếu thì Vua buộc phải dời."}, {"t": "h3", "text": "Tia X (X-Ray attack)"}, {"t": "p", "html": "Một quân tấn công hoặc bảo vệ một ô xuyên qua quân đối phương. <em>Dấu hiệu:<\/em> Nhìn xuyên qua quân đứng giữa: khi quân đó đi hoặc bị đổi, đường mở ra ngay."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "replay", "title": "Puzzle mẫu #8bfqN", "fen": "2kr1bnr/ppp2ppp/8/1B1P1q2/2P1p3/4BP2/PP3P1P/RN1Q1RK1 b - - 0 11", "moves": ["exf3", "Kh1", "Qh3", "Rg1", "Bd6", "Rg3", "Bxg3"], "intro": "Trắng vừa đi gxf3. Đen đi. Puzzle Lichess #8bfqN, rating 1941. Chủ đề: đòn ghim.", "notes": {"1": "Đen: Tốt ăn Tốt ở f3.", "2": "Trắng: Vua đi tới h1.", "3": "Đen: Hậu đi tới h3.", "4": "Trắng: Xe đi tới g1.", "5": "Đen: Tượng đi tới d6.", "6": "Trắng: Xe đi tới g3.", "7": "Đen: Tượng ăn Xe ở g3."}}]}, {"id": "the-co", "nav": "Bài tập", "tag": "Bài tập 1800–2000", "h": "Thế cờ cấp 1800 đến 2000", "blocks": [{"t": "p", "html": "Puzzle Lichess có rating từ 1800 đến 2000 (hoặc sát mức đó). Chọn nước đi đầu tiên rồi xem lời giải. Hãy tính hết biến trước khi trả lời."}, {"t": "positions", "items": [{"fen": "5rk1/p5pp/2n2q2/3pb3/4p2Q/1P2P2R/P5PP/2R3K1 b - - 1 23", "moves": ["Nb4"], "q": "Puzzle Lichess #Ve1Zy (rating 1860). Tìm nước đi đầu tiên.", "o": ["Qxh7+", "Qxe4", "Qxf6", "Qg5"], "a": 0, "e": "Lời giải: 24.Qxh7+ Kf7 25.Rf1. Chủ đề: đòn ghim.", "id": "b8-d63088e8"}, {"fen": "r2nk2r/pp2qpp1/1n2p2p/3pP1NQ/b2P1P2/R1PB4/6PP/1N3RK1 b kq - 0 17", "moves": ["Nc6"], "q": "Puzzle Lichess #bnjFL (rating 1857). Tìm nước đi đầu tiên.", "o": ["Nxf7", "Nxe6", "Qxf7+", "Qxh6"], "a": 0, "e": "Lời giải: 18.Nxf7 Qxf7 19.Bg6. Chủ đề: hy sinh, đòn ghim, tấn công f2 hoặc f7.", "id": "b8-0d5a7006"}, {"fen": "3q1knQ/1b2p3/3pPbB1/1pp3p1/r7/8/PPP3PP/R4R1K b - - 0 19", "moves": ["Rh4"], "q": "Puzzle Lichess #eDxy8 (rating 1942). Tìm nước đi đầu tiên.", "o": ["Bh7", "Qxg8+", "Qxf6+", "Rxf6+"], "a": 0, "e": "Lời giải: 20.Bh7 Rxh7 21.Qxh7. Chủ đề: đòn ghim.", "id": "b8-9e7352d1"}, {"fen": "r1b2r2/p4pkR/2pp2P1/4p3/3P1bp1/2PB4/P1P5/3KR1N1 b - - 1 23", "moves": ["Kg8"], "q": "Puzzle Lichess #kr5s2 (rating 1842). Tìm nước đi đầu tiên.", "o": ["g7", "gxf7+", "dxe5", "  "Qxg7+", "Kxg7"], "q": "Puzzle Lichess #pZ0vQ (rating 1902). Lời giải mở đầu 40.Qxg7+ Kxg7. Trắng đi: nước tiếp theo?", "o": ["Rh7+", "Rh6", "Rh5", "Rg1"], "a": 0, "e": "Lời giải đầy đủ: 40.Qxg7+ Kxg7 41.Rh7+ Kf8 42.Rxa7. Chủ đề: hy sinh, đòn xiên, thu hút.", "id": "b8-8991de69"}, {"q": "Chủ đề “Ghim” (Lichess: Pin) mô tả điều gì?", "o": ["Một quân không thể rời chỗ mà không để lộ đòn tấn công vào quân có giá trị cao hơn.", "Nắm bắt cơ hội để có lợi thế quyết định (đánh giá từ 200 đến 600 centipawn).", "Nước đi, thường kèm nhịp, dọn một ô, cột hoặc đường chéo cho đòn chiến thuật tiếp theo.", "Hậu chiếu hết một Vua đứng sát, mà hai ô thoát duy nhất của nó đều bị chính quân mình chặn."], "a": 0, "e": "Theo Lichess: Một quân không thể rời chỗ mà không để lộ đòn tấn công vào quân có giá trị cao hơn.", "id": "b8-d52fe150"}, {"q": "Chủ đề “Xiên” (Lichess: Skewer) mô tả điều gì?", "o": ["Quân giá trị cao bị tấn công, phải dời đi, rồi quân giá trị thấp hơn đứng sau bị ăn hoặc bị tấn công. Ngược lại với ghim.", "Tấn công Vua đối phương sau khi họ nhập thành ngắn.", "Hy sinh vật chất trong ngắn hạn để lấy lại lợi thế sau một chuỗi nước ép buộc.", "Chiếu hết trong ba nước."], "a": 0, "e": "Theo Lichess: Quân giá trị cao bị tấn công, phải dời đi, rồi quân giá trị thấp hơn đứng sau bị ăn hoặc bị tấn công. Ngược lại với ghim.", "id": "b8-f61c1896"}]}]}, {"id": "lien-ket", "nav": "Liên kết", "tag": "Liên kết ngoài", "h": "Ôn tập trên Lichess đúng nội dung buổi này", "blocks": [{"t": "links", "items": [{"k": "Luyện tập", "t": "Practice: The Pin", "href": "https://lichess.org/practice/fundamental-tactics/practicestnamthepin/9ogFv8Ac", "d": "Phần Practice “The Pin” của Lichess."}, {"k": "Luyện tập", "t": "Practice: The Skewer", "href": "https://lichess.org/practice/fundamental-tactics/practicestnamtheskewer/tuoBxVE5", "d": "Phần Practice “The Skewer” của Lichess."}, {"k": "Luyện tập", "t": "Practice: X-Ray", "href": "https://lichess.org/practice/fundamental-tactics/practicestnamxray
