<script>window.LESSON = {"so": 9, "ngay": "2027-01-21", "title": "Đòn đôi, tấn công khám phá và chiếu kép", "lead": "Ba mô-típ tạo hai đe dọa cùng lúc. Buổi này luyện tìm đòn đôi, đòn khám phá và chiếu kép trong thế cờ phức tạp.", "prev": {"file": "buoi-08.html", "title": "Buổi 8"}, "next": {"file": "buoi-10.html", "title": "Buổi 10"}, "keyPoints": ["Đòn đôi: Một quân tấn công hai hoặc nhiều quân đối phương cùng lúc.", "Tấn công khám phá: Dời một quân, thường là Mã, đang che đường của quân tầm xa như Xe, để quân tầm xa tấn công.", "Chiếu kép: Chiếu bằng hai quân cùng lúc, nhờ một đòn khám phá mà cả quân vừa đi lẫn quân được mở đường đều chiếu Vua.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Đòn đôi (Fork)"}, {"t": "p", "html": "Một quân tấn công hai hoặc nhiều quân đối phương cùng lúc. <em>Dấu hiệu:<\/em> Đòn đôi mạnh nhất khi kèm chiếu. Kiểm tra ô đáp có bị ăn hay không. Mã và Tốt tạo đòn đôi khó chống nhất."}, {"t": "h3", "text": "Tấn công khám phá (Discovered attack)"}, {"t": "p", "html": "Dời một quân, thường là Mã, đang che đường của quân tầm xa như Xe, để quân tầm xa tấn công. <em>Dấu hiệu:<\/em> Quân che di chuyển kèm đe dọa riêng sẽ tạo hai đe dọa cùng lúc, đối phương chỉ đáp được một."}, {"t": "h3", "text": "Chiếu kép (Double check)"}, {"t": "p", "html": "Chiếu bằng hai quân cùng lúc, nhờ một đòn khám phá mà cả quân vừa đi lẫn quân được mở đường đều chiếu Vua. <em>Dấu hiệu:<\/em> Chiếu kép chỉ giải bằng nước Vua. Nếu Vua không còn ô đi thì đó là chiếu hết."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle
