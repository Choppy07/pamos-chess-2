<script>window.LESSON = {"so": 13, "ngay": "2027-02-18", "title": "Tàn cuộc Hậu, Tượng và Mã", "lead": "Mỗi loại quân có đặc điểm riêng trong tàn cuộc. Buổi này luyện tàn cuộc Hậu, Tượng và Mã, kèm hai thế “sai màu Tượng” và “đúng màu Tượng” đối chiếu bằng tablebase.", "prev": {"file": "buoi-12.html", "title": "Buổi 12"}, "next": {"file": "buoi-14.html", "title": "Buổi 14"}, "keyPoints": ["Tàn cuộc Hậu: Tàn cuộc chỉ có Hậu và Tốt (cùng hai Vua).", "Tàn cuộc Tượng: Tàn cuộc chỉ có Tượng và Tốt (cùng hai Vua).", "Tàn cuộc Mã: Tàn cuộc chỉ có Mã và Tốt (cùng hai Vua).", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Tàn cuộc Hậu (Queen endgame)"}, {"t": "p", "html": "Tàn cuộc chỉ có Hậu và Tốt (cùng hai Vua). <em>Dấu hiệu:<\/em> Chiếu vĩnh viễn thường cứu bên yếu. Tốt thông cần Hậu hỗ trợ và Vua ít được che là điểm yếu."}, {"t": "h3", "text": "Tàn cuộc Tượng (Bishop endgame)"}, {"t": "p", "html": "Tàn cuộc chỉ có Tượng và Tốt (cùng hai Vua). <em>Dấu hiệu:<\/em> Tượng cùng màu: quân ít Tốt trên ô cùng màu với Tượng của mình thường có Tượng tốt hơn. Tượng khác màu hay hòa."}, {"t": "h3", "text": "Tàn cuộc Mã (Knight endgame)"}, {"t": "p", "html": "Tàn cuộc chỉ có Mã và Tốt (cùng hai Vua). <em>Dấu hiệu:<\/em> Mã đi chậm, nên hoạt động của Vua và Tốt thông xa quyết định. Mã cần ô an toàn và không bị cắt khỏi Tốt."}, {"t": "tip", "html": "<strong>Mẹo:<\/strong> trước khi giải puzzle, đoán chủ đề từ thế cờ rồi tính hết biến. Ở mức 1800 đến 2000, thua thường vì bỏ sót một nước đáp của đối phương."}]}, {"id": "mau", "nav": "Puzzle mẫu", "tag": "Puzzle mẫu", "h": "Tua một puzzle mẫu", "blocks": [{"t": "p", "html": "Bấm từng nước để xem thế cờ thay đổi. Lời bình mô tả từng nước đi."}, {"t": "repl
