<script>window.LESSON = {"so": 3, "ngay": "2026-12-10", "title": "Khai cuộc ít gặp: đòn đánh sớm và bẫy", "lead": "Ngoài các khai cuộc phổ biến, nhiều ván bị quyết định bởi một đòn chiến thuật sớm. Buổi này đi qua sáu khai cuộc ít gặp hơn và tìm đòn trong các puzzle rút từ chính những khai cuộc đó.", "prev": {"file": "buoi-02.html", "title": "Buổi 2"}, "next": {"file": "buoi-04.html", "title": "Buổi 4"}, "keyPoints": ["Scotch Game: 1.e4 e5 2.Nf3 Nc6 3.d4.", "Scandinavian Defense: 1.e4 d5.", "Pirc Defense: 1.e4 d6 2.d4 Nf6 3.Nc3 g6.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Scotch Game"}, {"t": "p", "html": "<strong>1.e4 e5 2.Nf3 Nc6 3.d4.<\/strong> Trắng mở trung tâm ngay bằng 3.d4 thay vì xây thế chậm; hai bên nhanh chóng trao đổi và quân dễ tấn công Vua."}, {"t": "h3", "text": "Scandinavian Defense"}, {"t": "p", "html": "<strong>1.e4 d5.<\/strong> Đen đánh vào Tốt e4 ngay nước đầu. Sau 2.exd5 Qxd5 3.Nc3, Hậu đen bị tấn công nên Trắng có nhịp phát triển."}, {"t": "h3", "text": "Pirc Defense"}, {"t": "p", "html": "<strong>1.e4 d6 2.d4 Nf6 3.Nc3 g6.<\/strong> Đen để Trắng dựng trung tâm Tốt rồi tấn công nó từ bên cạnh bằng Tượng g7. Thế cờ sắc nét, Trắng thường tấn công cánh Vua."}, {"t": "h3", "text": "English Opening"}, {"t": "p", "html": "<strong>1.c4.<\/strong> Khai cuộc cánh: Trắng kiểm soát d5 bằng Tốt c và chưa quyết định cấu trúc trung tâm, nên hay chuyển sang các khai cuộc khác."}, {"t": "h3", "text": "Slav Defense"}, {"t": "p", "html": "<strong>1.d4 d5 2.c4 c6.<\/strong> Đen bảo vệ d5 bằng Tốt c, giữ Tượng ô trắng tự do để ra ngoài trước ...e6."}, {"t": "h3", "text": "Vienna Game"}, {"t": "p", "html": "<strong>1.e4 e5 2.Nc3.<\/strong> Trắng phát triển Mã c3 trước, giữ .Nxd7 Qxd7 13.Bb5. Chủ đề: đòn ghim.", "id": "b3-a3a1479a"}, {"fen": "5b1r/1p1kpppp/p7/3NP3/4b3/4P3/PP3P1P/R3K2R w KQ - 1 18", "moves": ["O-O", "Bxd5", "Rfd1"], "q": "Puzzle Lichess #jUyIY (rating 1872). Lời giải mở đầu 18...Bxd5 19.Rfd1. Đen đi: nước tiếp theo?", "o": ["Ke6", "Kd8", "Kc6", "Kc7"], "a": 0, "e": "Lời giải đầy đủ: 18...Bxd5 19.Rfd1 Ke6. Chủ đề: quân treo.", "id": "b3-4a36c606"}, {"q": "Khai cuộc nào bắt đầu bằng 1.e4 d5?", "o": ["Scandinavian Defense", "Pirc Defense", "Vienna Game", "Scotch Game"], "a": 0, "e": "1.e4 d5 là Scandinavian Defense: Đen đánh ngay vào Tốt e4. Pirc bắt đầu 1.e4 d6, Vienna 1.e4 e5 2.Nc3, Scotch 1.e4 e5 2.Nf3 Nc6 3.d4.", "id": "b3-bd2072f0"}, {"q": "Slav Defense: sau 1.d4 d5 2.c4, Đen đáp nước nào để định nghĩa khai cuộc?", "o": ["2...c6", "2...e6", "2...dxc4", "2...Nf6"], "a": 0, "e": "2...c6 bảo vệ Tốt d5 bằng Tốt c và giữ Tượng ô trắng tự do. 2...e6 là Gambit Hậu từ chối, 2...dxc4 là Gambit Hậu nhận.", "id": "b3-4dc74481"}, {"q": "1.c4 là nước mở đầu của khai cuộc nào?", "o": ["English Opening", "Scotch Game", "Slav Defense", "Vienna Game"], "a": 0, "e": "1.c4 là English Opening, một khai cuộc cánh kiểm soát ô d5.", "id": "b3-a296c6c7"}]}]}, {"id": "lien-ket", "nav": "Liên kết", "tag": "Liên kết ngoài", "h": "Ôn tập trên Lichess đúng nội dung buổi này", "blocks": [{"t": "links", "items": [{"k": "Puzzle", "t": "Puzzle theo khai cuộc: Scotch Game", "href": "https://lichess.org/training/Scotch_Game", "d": "Luyện puzzle Lichess rút từ các ván có khai cuộc Scotch Game."}, {"k": "Puzzle", "t": "Puzzle theo khai cuộc: Scandinavian Defense", "href": "https://lichess.org/training/Scandinavian_Defense", "d": "Luyện puzzle Lichess rút từ các ván có khai cuộc Scandinavian Defense."}, {"k": "Puzzle", "t": "Puzzle theo khai cuộc: Pirc Defense", "href": "https://lichess.org/training/Pirc_Defense", "d": "Luyện puzzle Lichess rút từ các ván có khai cuộc Pirc Defense."}, {"k": "Puzzle", "t": "Puzzle theo khai cuộc: English Opening", "href":
