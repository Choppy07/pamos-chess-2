<script>window.LESSON = {"so": 6, "ngay": "2026-12-31", "title": "Quân treo, ăn quân bảo vệ và nước chen", "lead": "Những quân không được bảo vệ đủ là nguồn điểm dễ nhất, nhưng chúng thường được che bởi một nước chen hoặc một quân bảo vệ then chốt. Buổi này luyện quét quân treo và tìm nước chen.", "prev": {"file": "buoi-05.html", "title": "Buổi 5"}, "next": {"file": "buoi-07.html", "title": "Buổi 7"}, "keyPoints": ["Quân treo: Quân đối phương không được bảo vệ hoặc bảo vệ không đủ nên có thể ăn.", "Ăn quân bảo vệ: Loại bỏ quân giữ vai trò then chốt trong việc bảo vệ một quân khác, rồi ăn quân vừa hết bảo vệ ở nước sau.", "Nước chen: Thay vì đi nước được mong đợi, chen vào một nước đe dọa ngay mà đối phương phải đáp, rồi mới đi tiếp. Còn gọi là zwischenzug.", "Ở mức 1800 đến 2000, hãy tính hết biến và tìm nước đáp tốt nhất của đối phương trước khi đi."], "sections": [{"id": "kien-thuc", "nav": "Kiến thức", "tag": "Kiến thức", "h": "Nhận diện chủ đề", "blocks": [{"t": "p", "html": "Mỗi chủ đề dưới đây lấy mô tả từ Lichess, kèm dấu hiệu để nhận ra trong thế cờ thật."}, {"t": "h3", "text": "Quân treo (Hanging piece)"}, {"t": "p", "html": "Quân đối phương không được bảo vệ hoặc bảo vệ không đủ nên có thể ăn. <em>Dấu hiệu:<\/em> Trước mỗi nước đi, quét xem quân nào của hai bên không có bảo vệ hoặc chỉ được bảo vệ bằng quân có giá trị cao hơn."}, {"t": "h3", "text": "Ăn quân bảo vệ (Capture the defender)"}, {"t": "p", "html": "Loại bỏ quân giữ vai trò then chốt trong việc bảo vệ một quân khác, rồi ăn quân vừa hết bảo vệ ở nước sau. <em>Dấu hiệu:<\/em> Hỏi: quân nào đang bảo vệ mục tiêu? Nếu ăn hoặc đẩy được quân đó đi thì mục tiêu rơi."}, {"t": "h3", "text": "Nước chen (Intermezzo)"}, {"t": "p", "html": "Thay vì đi nước được mong đợi, chen vào một nước đe dọa ngay mà đối phương phải đáp, rồi mới đi tiếp. Còn gọi là zwischenzug. <em>Dấu hiệu:<\/em> Trước khi ăn lại hoặc đáp trả, hỏi: có nước chiếu hoặc đe dọa lớn hơn không? Hỏi cả cho đối phương."}, {"t": "tip", "html": "<s 6-824e4bad"}, {"fen": "r2q1r1k/ppp2pp1/4b2p/8/3pP2P/1B1P2Q1/PPP5/2K3RR b - - 4 20", "moves": ["Qf6"], "q": "Puzzle Lichess #t4CRQ (rating 1924). Tìm nước đi đầu tiên.", "o": ["e5", "Qxg7+", "Qxc7", "Bxe6"], "a": 0, "e": "Lời giải: 21.e5 Qg6 22.Qxg6 fxg6 23.Bxe6. Chủ đề: ăn quân bảo vệ.", "id": "b6-5581cdc8"}, {"fen": "2r3k1/4b1pp/3p1p2/1R2p1P1/3qP2P/pPp2P2/P3Q3/1K5R w - - 0 29", "moves": ["Rd1"], "q": "Puzzle Lichess #UHlhw (rating 1802). Tìm nước đi đầu tiên.", "o": ["c2+", "fxg5", "Qxd1+", "Qxe4+"], "a": 0, "e": "Lời giải: 29...c2+ 30.Qxc2 Rxc2 31.Rxd4 Rb2+ 32.Kc1 exd4. Chủ đề: Tốt tiến sâu, đòn đôi, nước chen.", "id": "b6-86961a13"}, {"fen": "3r1rk1/pp3ppp/2qbb3/8/1PPppB2/P5Q1/B4PPP/R3R1K1 b - - 3 19", "moves": ["Bxc4"], "q": "Puzzle Lichess #yfU1Y (rating 1951). Tìm nước đi đầu tiên.", "o": ["Bxd6", "Qxg7+", "Bxc4", "Rxe4"], "a": 0, "e": "Lời giải: 20.Bxd6 Rxd6 21.Bxc4 Rg6 22.Qb3. Chủ đề: nước phòng thủ, nước chen.", "id": "b6-22278866"}]}]}, {"id": "quiz", "nav": "Quiz", "tag": "Quiz", "h": "Kiểm tra cuối buổi", "blocks": [{"t": "quiz", "items": [{"fen": "r7/4kpp1/4p3/2Nb3p/p2P1P1P/R5K1/P2R2P1/2r5 w - - 0 33", "moves": ["Rxa4", "Rxc5", "Rxa8"], "q": "Puzzle Lichess #JhOc5 (rating 1919). Lời giải mở đầu 33...Rxc5 34.Rxa8. Đen đi: nước tiếp theo?", "o": ["Rc3+", "Bxa8", "Bxa2", "Bxg2"], "a": 0, "e": "Lời giải đầy đủ: 33...Rxc5 34.Rxa8 Rc3+ 35.Kf2 Bxa8. Chủ đề: hy sinh, nước chen.", "id": "b6-60c3f9a4"}, {"fen": "r4b1r/1b1qnkpp/p2p1p2/1p1P4/3N1B2/1P6/1P2QPPP/R3R1K1 b - - 0 17", "moves": ["Bxd5", "Qh5+", "Kg8"], "q": "Puzzle Lichess #PcK1N (rating 1949). Lời giải mở đầu 18.Qh5+ Kg8. Trắng đi: nước tiếp theo?", "o": ["Rxe7", "Qxd5+", "Rxa6", "Qxh7+"], "a": 0, "e": "Lời giải đầy đủ: 18.Qh5+ Kg8 19.Rxe7 Qxe7 20.Qxd5+ Qf7 21.Qxa8. Chủ đề: đòn đôi, dẫn dụ, ăn quân bảo vệ.", "id": "b6-d4d40fcf"}, {"fen": "3r3r/p1k3pp/2p1b3/1pbnP1B1/8/2P2BP1/PP3PP1/R2R2K1 b - - 5 21", "moves": ["Be7", "Bxd5", "Rxd5"], "q": "Puzzle Lichess #LMGcQ (rating 1874). Lời giải mở đầu 22.Bxd5 Rxd5. Trắng đi: nước tiếp theo?", "o": ["Bxe7", "Rxd5", "Bf6", "Bh4"], "a": 0, "e": "Lời giải đầy đủ: 22.Bxd5 Rxd5 23.Bxe7. Chủ đề: ăn quân bảo vệ.", "id": "b6-1babd7c3"}, {"q": "Chủ đề “Quân treo” (Lichess: Hanging piece) mô tả điều gì?", "o": ["Quân đối phương không được bảo vệ hoặc bảo vệ không đủ nên có thể ăn.", "Nước đi, thường kèm nhịp, dọn một ô, cột hoặc đường chéo cho đòn chiến thuật tiếp theo.", "Mã và Xe phối hợp dồn Vua đối phương vào một góc bàn cờ.", "Tàn cuộc chỉ có Tốt (cùng hai Vua)."], "a": 0, "e": "Theo Lichess: Quân đối phương không được bảo vệ hoặc bảo vệ không đủ nên có thể ăn.", "id": "b6-d6af7a01"}, {"q": "Chủ đề “Ăn quân bảo vệ” (Lichess: Capture the defender) mô tả điều gì?", "o": ["Loại bỏ quân giữ vai trò then chốt trong việc bảo vệ một quân khác, rồi ăn quân vừa hết bảo vệ ở nước sau.", "Nắm bắt cơ hội để có lợi thế quyết định (đánh giá từ 200 đến 600 centipawn).", "Nước đi, thường kèm nhịp, dọn một ô, cột hoặc đường chéo cho đòn chiến thuật tiếp theo.", "Hậu chiếu hết một Vua đứng sát, mà hai ô thoát duy nhất của nó đều bị chính quân mình chặn."], "a": 0, "e": "Theo Lichess: Loại bỏ quân giữ vai trò then chốt trong việc bảo vệ một quân khác, rồi ăn quân vừa hết bảo vệ ở nước sau.", "id": "b6-58558f0e"}]}]}, {"id": "lien-ket", "nav": "Liên kết", "tag": "Liên kết ngoài", "h": "Ôn tập trên Lichess đúng nội dung buổi này", "blocks": [{"t": "links", "items": [{"k": "Luyện tập", "t": "Practice: Overloaded Pieces", "href": "https://lichess.org/practice/fundamental-tactics/practicestnamoverloadedpieces/o734CNqp", "d": "Phần Practice “Overloaded Pieces” của Lichess."}, {"k": "Luyện tập", "t": "Practice: Zwischenzug", "href": "https://lichess.org/practice/fundamental-tactics/practicestnamzwischenzug/ITWY4GN2", "d": "Phần Practice “Zwischenzug” của Lichess."}, {"k": "Puzzle", "t": "Puzzle theo chủ đề: Hanging piece", "href": "https://lichess.org/training/hangingPiece", "d": "Luyện puzzle Lichess theo chủ đề quân treo. "}, {"k": "Puzzle", "t": "Puzzle
